questions.forEach((q,i)=>{const card=document.createElement('section');card.className='q';const title=document.createElement('p');title.className='qt';title.textContent=(i+1)+'. '+q.q;card.append(title);const opts=document.createElement('div');opts.className='opts';const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('aria-live','polite');q.opts.forEach((answer,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.setAttribute('aria-pressed','false');const mark=document.createElement('span');mark.className='mark';const txt=document.createElement('span');txt.className='opttext';txt.textContent=letters[j]+'. '+answer.split(' — ').slice(0,2).join(' — ');b.append(mark,txt);b.addEventListener('click',()=>{if(selected[i]!==null)return;selected[i]=j;opts.querySelectorAll('.opt').forEach((el,k)=>{el.classList.toggle('selected',k===j);el.classList.toggle('correct',k===q.correct);el.classList.toggle('wrong',k===j&&k!==q.correct);el.setAttribute('aria-pressed',String(k===j));el.querySelector('.mark').textContent=k===q.correct?'✓':(k===j?'✗':'');el.disabled=true});if(j===q.correct){feedback.className='feedback good';feedback.textContent='✓ সঠিক উত্তর! বাংলা অর্থ: '+q.opts[q.correct].split(' — ').slice(2).join(' — ')}else{feedback.className='feedback bad';feedback.textContent='✗ ভুল উত্তর। সঠিক উত্তর: '+letters[q.correct]+'. '+q.opts[q.correct]}});opts.append(b)});card.append(opts,feedback);quiz.append(card)});
